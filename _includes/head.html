<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {% endif %}

  {% capture page_title %}{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}{% endcapture %}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/images/favicons/favicon-194x194.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/png" href="{{ '/images/favicons/favicon-32x32.png' | relative_url }}" sizes="32x32">
  <link rel="icon" type="image/png" href="{{ '/images/favicons/favicon-16x16.png' | relative_url }}" sizes="16x16">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/favicons/apple-touch-icon-180x180.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/favicons/manifest.json' | relative_url }}">
  <meta name="theme-color" content="#fcfcfb">

  <!-- Same storage key and values as the Quarto blog, so the light/dark choice carries across both sites. -->
  <script>
    try { if (localStorage.getItem('quarto-color-scheme') === 'alternate') document.documentElement.setAttribute('data-theme', 'dark') } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?{{ site.time | date: '%s' }}">

  {% include analytics.html %}
</head>

<footer class="col footer">
  <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
  <button type="button" class="theme-toggle" aria-label="Switch between light and dark mode">
    <span class="when-light">Dark mode</span><span class="when-dark">Light mode</span>
  </button>
</footer>

<script>
  document.querySelector('.theme-toggle').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('quarto-color-scheme', dark ? 'alternate' : 'default') } catch (e) {}
  });
</script>

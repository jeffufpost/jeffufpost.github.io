project:
  type: website
  output-dir: _site
  post-render: scripts/remove-draft-stubs.ts
  resources:
    - /CNAME
    - /robots.txt
    - /images/favicons/**
    - /assets/**
  render:
    - "*.qmd"
    - "*.ipynb"
    - "health/**/*.md"
    - "!README.md"
    - "!tests/"
    - "!scripts/"

website:
  title: "Jeffrey Post"
  site-url: "https://jeffreypost.dev"
  draft-mode: gone
  navbar:
    background: light
    left: []
    right:
      - text: Homelab
        href: homelab/index.qmd
      - text: Apps
        href: apps/index.qmd
      - text: Health
        href: health/index.qmd
      - text: About
        href: about/index.qmd
      - text: Request CV
        href: "mailto:contact@jeffreypost.dev?subject=CV%20request"
  page-footer:
    left: |
      <span class="font-monospace">contact@jeffreypost.dev</span>
    right: |
      <a class="cv-link plausible-event-name=Request+CV" href="mailto:contact@jeffreypost.dev?subject=CV%20request">Request CV</a> · <a href="https://github.com/jeffufpost">GitHub</a>

format:
  html:
    theme: [cosmo, theme/site.scss]
    include-in-header: partials/head.html
    include-after-body: partials/after-body.html
    toc: false
